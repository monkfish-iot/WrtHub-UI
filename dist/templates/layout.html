<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WrtHub-UI</title>
    <!-- 静态资源：见 internal/assets（go:embed）+ ./assets 外部覆盖（开发技术文档 §8） -->
    <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/all.min.css" rel="stylesheet">
    <style>
        body { font-size: 0.85rem; background-color: #f4f6f9; }
        .sidebar { background-color: #1e2a3a; color: #cfdde6; transition: all 0.3s; }
        .sidebar .nav-link { color: #cfdde6; font-size: 0.85rem; padding: 0.55rem 1rem; border-left: 3px solid transparent; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #0f1a24; color: white; border-left-color: #0d6efd; }
        .sidebar .nav-link i { width: 1.6rem; font-size: 1rem; }
        .navbar { padding-top: 0.3rem; padding-bottom: 0.3rem; }
        .card-header { padding: 0.6rem 1rem; background-color: #fff; border-bottom: 1px solid #e9ecef; }
        .table th, .table td { padding: 0.5rem 0.6rem; vertical-align: middle; }
        .toolbar-compact { background-color: #fff; padding: 0.6rem 1rem; border-bottom: 1px solid #e9ecef; }
        .btn-sm { padding: 0.25rem 0.7rem; font-size: 0.75rem; }
        .form-control-sm, .form-select-sm { font-size: 0.75rem; }
        /* 表单控件：浅灰底 + 深灰描边，与白色卡片背景明显区分 */
        .form-control, .form-select { border-color: #6c7a8c; background-color: #f1f3f6; border-width: 1px; }
        .form-control:hover, .form-select:hover { border-color: #4a5568; background-color: #eef1f5; }
        .form-control:focus, .form-select:focus { border-color: #4d8ffd; background-color: #fff; box-shadow: 0 0 0 0.15rem rgba(13,110,253,0.18); }
        .form-control:disabled, .form-control[readonly], .form-select:disabled { background-color: #e9ecef; border-color: #9faab8; }
        .form-check-input { border-color: #6c7a8c; background-color: #f1f3f6; }
        @media (max-width: 768px) {
            .sidebar { position: fixed; transform: translateX(-100%); z-index: 1050; transition: transform 0.3s; }
            .sidebar.show { transform: translateX(0); }
        }
    </style>
</head>
<body>
<div class="d-flex flex-column vh-100">
    <nav class="navbar navbar-expand-md navbar-dark bg-dark flex-shrink-0">
        <div class="container-fluid px-3">
            <a class="navbar-brand py-0" href="/">✨ WrtHub-UI</a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <span class="text-light small">
                    <i class="fas fa-user-circle me-1"></i>
                    {{if .CurrentUser}}{{.CurrentUser.Username}}{{else}}未登录{{end}}
                </span>
                <form method="post" action="/logout" class="d-inline ms-2">
                    <button type="submit" class="btn btn-sm btn-outline-light">
                        <i class="fas fa-sign-out-alt"></i> 退出
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="d-flex flex-grow-1 overflow-hidden">
        <div class="sidebar flex-shrink-0" style="width:220px;" id="sidebar">
            <div class="pt-3 pb-2 px-2">
                <ul class="nav nav-pills flex-column mb-2">
                    <li class="nav-item">
                        <a href="/overview" class="nav-link {{if eq .ActiveMenu `overview`}}active{{end}}">
                            <i class="fas fa-gauge-high"></i> 概况
                        </a>
                    </li>
                </ul>
                <hr class="bg-secondary">
                <div class="small text-uppercase text-secondary-emphasis px-2 mb-2">
                    <i class="fas fa-network-wired me-1"></i> 设备与网络
                </div>
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item">
                        <a href="/devices" class="nav-link {{if eq .ActiveMenu `devices`}}active{{end}}">
                            <i class="fas fa-server"></i> 设备管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/auth-source" class="nav-link {{if eq .ActiveMenu `radius`}}active{{end}}">
                            <i class="fas fa-key"></i> 认证源管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/sessions" class="nav-link {{if eq .ActiveMenu `sessions`}}active{{end}}">
                            <i class="fas fa-users"></i> 在线会话
                        </a>
                    </li>

                </ul>
                <hr class="bg-secondary">
                <div class="small text-uppercase text-secondary-emphasis px-2 mb-2">
                    <i class="fas fa-wifi me-1"></i> PORTAL 认证
                </div>
                <ul class="nav nav-pills flex-column">
                    <li class="nav-item">
                        <a href="/portal/templates" class="nav-link {{if eq .ActiveMenu `portal_templates`}}active{{end}}">
                            <i class="fas fa-file-code"></i> 认证模板
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/portal/policies" class="nav-link {{if eq .ActiveMenu `portal_policies`}}active{{end}}">
                            <i class="fas fa-shield-halved"></i> 认证策略
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/portal/auth-logs" class="nav-link {{if eq .ActiveMenu `portal_auth_logs`}}active{{end}}">
                            <i class="fas fa-file-lines"></i> 认证日志
                        </a>
                    </li>
                </ul>
                <hr class="bg-secondary">
                <div class="small text-uppercase text-secondary-emphasis px-2 mb-2">
                    <i class="fas fa-cogs me-1"></i> 系统
                </div>
                <ul class="nav nav-pills flex-column">
                    <li class="nav-item">
                        <a href="/settings" class="nav-link {{if eq .ActiveMenu `settings`}}active{{end}}">
                            <i class="fas fa-sliders"></i> 系统设置
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/users" class="nav-link {{if eq .ActiveMenu `users`}}active{{end}}">
                            <i class="fas fa-user-gear"></i> 本地账号
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/operation-logs" class="nav-link {{if eq .ActiveMenu `oplogs`}}active{{end}}">
                            <i class="fas fa-clipboard-list"></i> 操作日志
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="flex-grow-1 overflow-auto p-2 p-md-3">
            {{block "content" .}}{{end}}
        </div>
    </div>
</div>
<script src="/assets/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/htmx.min.js" defer></script>
</body>
</html>
