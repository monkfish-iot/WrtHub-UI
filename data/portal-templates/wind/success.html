<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>登录成功</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="breeze breeze-1" aria-hidden="true"></div>
  <div class="breeze breeze-2" aria-hidden="true"></div>

  <main class="shell">
    <section class="card">
      <div class="accent" id="pAccent"></div>
      <div class="card-inner">
        <header class="brand">
          <span class="brand-mark" id="pBrandMark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <path d="M3 8h9.5a2.5 2.5 0 1 0-2.5-2.5"/>
              <path d="M3 12h13a2.5 2.5 0 1 1-2.5 2.5"/>
              <path d="M3 16h6.5a2 2 0 1 1-2 2"/>
            </svg>
          </span>
          <img class="brand-logo" id="pLogo" alt="logo">
          <span class="brand-text">
            <b id="pBrand">Wind WiFi</b>
            <small id="pTagline">轻盈 · 顺畅 · 安全</small>
          </span>
        </header>

        <div class="ok-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </div>

        <div class="center">
          <h1 id="pTopic">登录成功</h1>
          <p class="sub" id="pSub">网络已连接，开始畅享清风般的极速体验</p>
        </div>

        <dl class="session" id="pSession" hidden>
          <div class="row"><dt>IP 地址</dt><dd id="pIp">-</dd></div>
          <div class="row"><dt>剩余在线时长</dt><dd id="pTime">-</dd></div>
          <div class="row"><dt>下行速率</dt><dd id="pDown">-</dd></div>
          <div class="row"><dt>上行速率</dt><dd id="pUp">-</dd></div>
          <div class="row"><dt>剩余流量</dt><dd id="pQuota">-</dd></div>
        </dl>

        <p class="foot" id="pFoot">如遇网络问题，请联系现场工作人员</p>
        <span class="tag">WIND PORTAL</span>
      </div>
    </section>
  </main>

  <script>
  // 成功页：从 URL query 读取 webauthd 返回的会话信息（User-IP / Session-Timeout /
  // In-Rate / Out-Rate / Quota-Data），同时支持 window.PORTAL_CONFIG 与 query 的
  // 可视化定制注入（与登录页一致）。
  (function () {
    var cfg = window.PORTAL_CONFIG || {};
    var q = new URLSearchParams(location.search);
    q.forEach(function (v, k) { if (k !== 't') cfg[k] = v; });

    function $(id) { return document.getElementById(id); }
    function text(id, v) { if (v) { var el = $(id); if (el) el.textContent = v; } }
    function color(v) { return /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v || '') ? v : ''; }
    function cssURL(v) {
      if (!v) { return ''; }
      var s = String(v).replace(/["\\\n\r]/g, function (c) { return encodeURIComponent(c); });
      return 'url("' + s + '")';
    }

    if (cfg.success_page_title) { document.title = cfg.success_page_title; }
    text('pBrand', cfg.brand);
    text('pTagline', cfg.tagline);
    text('pTopic', cfg.success_topic);
    text('pSub', cfg.success_subtitle);
    text('pFoot', cfg.success_footer || cfg.footer);

    var c1 = color(cfg.accent_color), c2 = color(cfg.accent_color_end);
    if (c1) { document.documentElement.style.setProperty('--accent', c1); }
    if (c2) { document.documentElement.style.setProperty('--accent-2', c2); }

    if (cfg.bg_image) {
      document.body.style.backgroundImage = cssURL(cfg.bg_image);
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
      document.body.style.backgroundRepeat = 'no-repeat';
    } else if (color(cfg.bg_color)) {
      document.body.style.background = cfg.bg_color;
    }

    if (cfg.logo_image) {
      $('pLogo').src = cfg.logo_image;
      $('pLogo').style.display = 'block';
      $('pBrandMark').style.display = 'none';
    }

    function bytesToSize(bytes) {
      if (typeof bytes === 'undefined' || bytes === null || bytes === '') { return ''; }
      var n = Number(bytes);
      if (!isFinite(n)) { return ''; }
      if (n === 0) { return '不限流量'; }
      var k = 1024, sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      var i = Math.min(Math.floor(Math.log(n) / Math.log(k)), sizes.length - 1);
      return (n / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
    }
    function bitsToSize(bits) {
      if (typeof bits === 'undefined' || bits === null || bits === '') { return ''; }
      var n = Number(bits);
      if (!isFinite(n)) { return ''; }
      if (n === 0) { return '不限速'; }
      var k = 1024, sizes = ['b', 'Kb', 'Mb', 'Gb', 'Tb'];
      var i = Math.min(Math.floor(Math.log(n) / Math.log(k)), sizes.length - 1);
      return (n / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i] + 'ps';
    }
    function formatTime(sec) {
      if (typeof sec === 'undefined' || sec === null || sec === '') { return ''; }
      var n = parseInt(sec, 10);
      if (!isFinite(n)) { return ''; }
      if (n === 0) { return '不限时'; }
      var d = Math.floor(n / 86400), h = Math.floor((n % 86400) / 3600),
          m = Math.floor((n % 3600) / 60), s = n % 60;
      return (d ? d + '天' : '') + (h ? h + '小时' : '') + (m ? m + '分' : '') + (s ? s + '秒' : '');
    }

    var ip = q.get('User-IP');
    var timeout = formatTime(q.get('Session-Timeout'));
    var down = bitsToSize(q.get('In-Rate'));
    var up = bitsToSize(q.get('Out-Rate'));
    var quota = bytesToSize(q.get('Quota-Data'));

    if (ip || timeout || down || up || quota) {
      text('pIp', ip || '-');
      text('pTime', timeout || '-');
      text('pDown', down || '-');
      text('pUp', up || '-');
      text('pQuota', quota || '-');
      $('pSession').hidden = false;
    }
  })();
  </script>
</body>
</html>
